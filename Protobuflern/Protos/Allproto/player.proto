syntax = "proto3";

// 包名：相当于命名空间，防止不同项目消息重名
package demo;

// C# 生成的命名空间（两端共用这一份协议）
option csharp_namespace = "Protobuflern.Demo";

// 玩家消息
message Player {
  string name = 1;   // 名字
  int32  age  = 2;   // 年龄
  Gender gender = 3; // 性别
  string loveFood = 4;
}

// 性别枚举
enum Gender {
  GENDER_UNSPECIFIED = 0; // proto3 规定第一个枚举值必须为 0
  MALE   = 1;
  FEMALE = 2;
}
