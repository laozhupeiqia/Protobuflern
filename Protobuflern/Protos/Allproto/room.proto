syntax = "proto3";

package demo;

option csharp_namespace = "Protobuflern.Demo";

// 房间 = 一个在线玩家的世界。每个在线玩家都是一个"潜在房间"，点谁的"加入"，谁就是房主。
// 房间在被加入时才创建（懒创建），本文件只放"房间"相关消息。

// 房间概要（房间列表里显示用）：房主账号即房间唯一标识
message RoomInfo {
  string hostId   = 1; // 房主账号（=房间标识）
  string hostName = 2; // 房主昵称（显示用）
  int32  count    = 3; // 当前人数（含房主；还没人加入时=1）
}

// 房间列表快照：服务器下发给客户端刷新面板
message RoomListMsg {
  repeated RoomInfo rooms = 1;
}

// 加入房间请求（客户端→服务器）：A 点 B 的加入，hostId 填 B 的账号
message JoinRoomMsg {
  string hostId = 1; // 要加入的房间（房主账号）
}

// 加入结果（服务器→加入者）：成功时带房主和当前成员列表
message JoinRoomResult {
  int32          code    = 1; // 0=成功，非0=失败
  string         message = 2; // 提示语
  string         hostId  = 3; // 我加入的房间（房主账号）
  repeated string members = 4; // 房间当前成员账号（含我）
}

// 房间成员变动（服务器→房间内所有成员）：有人加入/离开时通知，带完整成员列表方便直接同步本地房间状态
message RoomMemberChangedMsg {
  string         hostId   = 1; // 房间（房主账号）
  string         memberId = 2; // 变动的成员账号
  bool           joined   = 3; // true=加入，false=离开
  repeated string members  = 4; // 变动后的完整成员列表
}
